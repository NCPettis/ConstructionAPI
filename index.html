<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css\construction-api.css">
    <title>Construction API</title>
</head>
<body>

<section id="webApp">
    <h1> Better than a Port-O-Potty</h1>
    <p> Sometimes you just have to WASH your hands. Hand sanitizer wont remove the dirt from under your nails. Enter your city to find a list of the local bathrooms in the area. <em>Partial city names not accepted. Ex "Los Angeles" NOT "LA"</em>    </p>

    <label for="cityInput">Search the site:</label>
    <input type="search" id="cityInput" name="q" />
    <button>Search</button>


    <table> 
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Address</th>
            <th scope="col">Accessible</th>
            <th scope="col">Unisex</th>
        </tr>
    </table>
</section>


 <script src="js/construction-api.js" ></script>  
</body>
</html>
